apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-app-config
  namespace: rag
data:
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_MODEL: gemma3:4b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
  namespace: rag
spec:
  # Each pod builds its own small vector DB at startup, so replicas are stateless.
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: rag-app}
  template:
    metadata:
      labels: {app: rag-app}
    spec:
      containers:
        - name: app
          image: ghcr.io/ainaziksamatkyzy/rag-study-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: rag-app-config
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          # Ingest runs before the server starts; give it time before probing.
          startupProbe:
            httpGet: {path: /healthz, port: 5000}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: 5000}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: 5000}
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-app
  namespace: rag
spec:
  type: NodePort
  selector: {app: rag-app}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30500
---
# Scale 2-5 replicas on CPU. Needs the metrics-server add-on.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-app
  namespace: rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
